# Cloud Build pipeline: build → push to Artifact Registry → deploy to Cloud Run
# Required substitution variables (set in trigger or via --substitutions):
#   _REGION              e.g. us-central1
#   _REPO                Artifact Registry repo name (must already exist), e.g. research-canvas
#   _SERVICE             Cloud Run service name, e.g. research-canvas
#   _GEMINI_SECRET_NAME  Name of the Secret Manager secret holding GEMINI_API_KEY
#                        e.g. gemini-api-key:latest

steps:
  # 1. Build the container image with cache from the previous build.
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push both tags to Artifact Registry.
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run, mounting the Gemini API key from Secret Manager.
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --concurrency=40
      - --timeout=120
      - --set-secrets=GEMINI_API_KEY=${_GEMINI_SECRET_NAME}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _REGION: us-central1
  _REPO: research-canvas
  _SERVICE: research-canvas
  _GEMINI_SECRET_NAME: gemini-api-key:latest

timeout: 1200s
